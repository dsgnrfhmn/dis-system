{#
  detail-pane: a row's details docked beside its table. The host clones this pane into
  the split's side and fills its body (DsDetailPane.block / .actions). title: the row's
  name; caption: a short line beside it.
#}
<section class="ds-pane ds-detail" aria-label="{{ title | default('Details') }}">
  <div class="ds-pane__head">
    <div class="ds-pane__heading">
      <span class="ds-pane__title" data-emphasis="true">{{ title | default('Details') }}</span>
      <span class="ds-pane__caption">{{ caption | default('') }}</span>
    </div>
    <button type="button" class="ds-text-button" data-priority="secondary" data-status="active" data-underline="dotted" data-action="close">Close</button>
  </div>
  <div class="ds-pane__body"><div class="ds-pane__scroll"><div class="ds-detail__body"></div></div></div>
</section>
