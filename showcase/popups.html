<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popups</title>
<!-- Popups card, Figma D_SYSTEM node 103:4812: Small / Medium / Big tabs
     (header-tab) over an open popup on its backdrop (popup, drawn inline via
     the documentation-only preview). The tabs switch the popup's own size
     prop (small 500px / medium 800px / large 1200px). The popup's buttons
     do nothing here: popup/component.js, which closes it, isn't loaded. -->
<link rel="stylesheet" href="../tokens/output.css">
<link rel="stylesheet" href="../components/text-button/style.css">
<link rel="stylesheet" href="../components/input/style.css">
<link rel="stylesheet" href="../components/header-tab/style.css">
<link rel="stylesheet" href="../components/popup/style.css">
<link rel="stylesheet" href="showcase.css">
<style>
  .showcase { display: block; padding: 0; }
  .showcase__tabs { display: flex; }
  .showcase__tabs > .ds-header-tab { flex: 1 1 0; }
</style>
</head>
<body>
<div class="showcase">
  <div class="showcase__tabs" role="tablist" aria-label="Popup size" data-popup-size-tabs>
<!--
  header-tab: one panel in a full-width row of N equal-width tabs (e.g. For
  You's For Review / Analysed / Archived / Filtered strip). Unlike
  table-header's own type="2-tabs" (a content-hugging chip holding both
  labels itself), each header-tab instance is composed independently by the
  consumer, who wraps N of them in a shared role="tablist" container -- see
  meta.json rationale for why this couldn't just be a prop-driven extension
  of table-header's existing 2-tabs variant.
-->
<button type="button" class="ds-header-tab" role="tab" aria-selected="false">
  <span class="ds-header-tab__text">
    <span class="ds-header-tab__label">Small</span>
  </span>
</button>
<!--
  header-tab: one panel in a full-width row of N equal-width tabs (e.g. For
  You's For Review / Analysed / Archived / Filtered strip). Unlike
  table-header's own type="2-tabs" (a content-hugging chip holding both
  labels itself), each header-tab instance is composed independently by the
  consumer, who wraps N of them in a shared role="tablist" container -- see
  meta.json rationale for why this couldn't just be a prop-driven extension
  of table-header's existing 2-tabs variant.
-->
<button type="button" class="ds-header-tab" role="tab" aria-selected="true">
  <span class="ds-header-tab__text">
    <span class="ds-header-tab__label">Medium</span>
  </span>
</button>
<!--
  header-tab: one panel in a full-width row of N equal-width tabs (e.g. For
  You's For Review / Analysed / Archived / Filtered strip). Unlike
  table-header's own type="2-tabs" (a content-hugging chip holding both
  labels itself), each header-tab instance is composed independently by the
  consumer, who wraps N of them in a shared role="tablist" container -- see
  meta.json rationale for why this couldn't just be a prop-driven extension
  of table-header's existing 2-tabs variant.
-->
<button type="button" class="ds-header-tab" role="tab" aria-selected="false">
  <span class="ds-header-tab__text">
    <span class="ds-header-tab__label">Big</span>
  </span>
</button>
  </div>
<div class="ds-popup-overlay" id="showcase-popup" data-placement="center" data-preview="inline">
  <div class="ds-popup" data-size="medium" role="dialog" aria-labelledby="showcase-popup-title" tabindex="-1">
    <div class="ds-popup__title" id="showcase-popup-title">Title</div>
    <div class="ds-popup__body" data-type="input">
<textarea class="ds-input" data-type="textarea" data-fill="filled" rows="8" placeholder="Input Placeholder"></textarea>
    </div>
    <div class="ds-popup__bottom">
<button class="ds-text-button" type="button" data-priority="secondary" data-status="active" data-underline="dotted" data-preview="inline" data-popup-dismiss>Button</button>
<button class="ds-text-button" type="button" data-priority="primary" data-status="active" data-underline="dotted" data-preview="inline" data-popup-dismiss>Button</button>
    </div>
  </div>
</div>
</div>
<script src="../components/text-button/component.js"></script>
<script src="../components/input/component.js"></script>
<script src="../components/header-tab/component.js"></script>
<script>
  // Tab label -> popup size (header-tab only switches aria-selected).
  const SIZES = { Small: 'small', Medium: 'medium', Big: 'large' };
  const popup = document.querySelector('#showcase-popup .ds-popup');
  document.querySelector('[data-popup-size-tabs]').addEventListener('ds-header-tab-change', (e) => {
    popup.dataset.size = SIZES[e.detail.selected.textContent.trim()];
  });
</script>
</body>
</html>
