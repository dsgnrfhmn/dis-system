<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tags</title>
<!-- Tags card, Figma D_SYSTEM node 103:4746: every tag type, Active over
     Passive, left-aligned, 20px apart, 40px padding. -->
<link rel="stylesheet" href="../tokens/output.css">
<link rel="stylesheet" href="../components/tag/style.css">
<link rel="stylesheet" href="showcase.css">
<style>
  .showcase { justify-content: flex-start; gap: var(--ds-spacing-6); }
  .showcase__col { align-items: flex-start; }
</style>
</head>
<body>
<div class="showcase">
  <div class="showcase__col">
<span class="ds-tag" data-type="accent-1" data-subtype="active">tag</span>
<span class="ds-tag" data-type="accent-1" data-subtype="passive">tag</span>
  </div>
  <div class="showcase__col">
<span class="ds-tag" data-type="accent-2" data-subtype="active">tag</span>
<span class="ds-tag" data-type="accent-2" data-subtype="passive">tag</span>
  </div>
  <div class="showcase__col">
<span class="ds-tag" data-type="accent-3" data-subtype="active">tag</span>
<span class="ds-tag" data-type="accent-3" data-subtype="passive">tag</span>
  </div>
  <div class="showcase__col">
<span class="ds-tag" data-type="success" data-subtype="active">tag</span>
<span class="ds-tag" data-type="success" data-subtype="passive">tag</span>
  </div>
  <div class="showcase__col">
<span class="ds-tag" data-type="warning" data-subtype="active">tag</span>
<span class="ds-tag" data-type="warning" data-subtype="passive">tag</span>
  </div>
  <div class="showcase__col">
<span class="ds-tag" data-type="danger" data-subtype="active">tag</span>
<span class="ds-tag" data-type="danger" data-subtype="passive">tag</span>
  </div>
  <div class="showcase__col">
<span class="ds-tag" data-type="neutral" data-subtype="active">tag</span>
<span class="ds-tag" data-type="neutral" data-subtype="passive">tag</span>
  </div>
</div>
</body>
</html>
