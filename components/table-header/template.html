{% set _type = type | default('1-tab') %}
{% if _type == '2-tabs' %}
<div class="ds-table-header" role="tablist">
  <button type="button" class="ds-table-header__tab" role="tab" aria-selected="{{ 'true' if (active_tab | default(0)) == 0 else 'false' }}">{{ tab1 | default('Status A') }}</button>
  <button type="button" class="ds-table-header__tab" role="tab" aria-selected="{{ 'true' if (active_tab | default(0)) == 1 else 'false' }}">{{ tab2 | default('Status B') }}</button>
  {% if info %}
  <span class="ds-table-header__info">{{ info }}</span>
  {% endif %}
</div>
{% elif _type == 'title-info' %}
<div class="ds-table-header">
  <span class="ds-table-header__title">{{ title | default('Title') }}</span>
  <span class="ds-table-header__info">{{ info | default('3 pages') }}</span>
</div>
{% else %}
<div class="ds-table-header">
  <span class="ds-table-header__title">{{ title | default('Title') }}</span>
</div>
{% endif %}
