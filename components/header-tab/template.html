<!--
  header-tab: one panel in a full-width row of N equal-width tabs (e.g. For
  You's For Review / Analysed / Archived / Filtered strip). Unlike
  table-header's own type="2-tabs" (a content-hugging chip holding both
  labels itself), each header-tab instance is composed independently by the
  consumer, who wraps N of them in a shared role="tablist" container -- see
  meta.json rationale for why this couldn't just be a prop-driven extension
  of table-header's existing 2-tabs variant.
-->
{% set _tag = 'a' if href else 'button' %}
<{{ _tag }}{% if href %} href="{{ href | safe_url }}"{% else %} type="button"{% endif %} class="ds-header-tab" role="tab" aria-selected="{{ 'true' if active else 'false' }}">
  <span class="ds-header-tab__text">
    <span class="ds-header-tab__label">{{ label | default('Tab') }}</span>
    {% if count %}
    <span class="ds-header-tab__count">{{ count }}</span>
    {% endif %}
  </span>
</{{ _tag }}>
