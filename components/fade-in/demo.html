<link rel="stylesheet" href="../../tokens/output.css">
<link rel="stylesheet" href="style.css">

<div style="padding: 20px; background: var(--ds-color-bg-surface); color: var(--ds-color-text-active);">
  <p>Rows added after the page was drawn fade in, one element each.</p>
  <div id="fade-demo-list"></div>
  <button type="button" id="fade-demo-add">Add a row</button>
</div>

<script src="component.js"></script>
<script>
  document.getElementById('fade-demo-add').addEventListener('click', function () {
    var row = document.createElement('p');
    row.textContent = 'Row ' + (document.querySelectorAll('#fade-demo-list p').length + 1);
    document.getElementById('fade-demo-list').append(row);
  });
</script>
