<!-- Loading spinner (explicit request 2026-10-25: "an ordinary spinning loading icon", replacing the half-filled circle of Figma D_SYSTEM DSYSTEMFILEKEY, icon set node 103:4711, Type=loading): a ring and a quarter of it with square ends, which reads as turning when the component rotates the glyph. The quarter is currentColor (the accent, where it is rendered); the ring is the private icon-fill property (a grey, set by the component) at icon-fill-opacity, and without them the same ink at a quarter opacity, as a plain image. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke-width="2" style="stroke: var(--_icon-fill, currentColor); stroke-opacity: var(--_icon-fill-opacity, 0.25)"/><path d="M12 4C16.418 4 20 7.582 20 12" stroke="currentColor" stroke-width="2"/></svg>
